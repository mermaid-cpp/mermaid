name: reuse.yml
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "master"
      - "dev"

jobs:
  reuse:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
      - name: REUSE metadata check
        uses: fsfe/reuse-action@v6
