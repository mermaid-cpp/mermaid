# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Build project"

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "cmake/**"
            - "*.h"
            - "*.hpp"
            - "*.cpp"
            - "*.cmake"
            - "CMakeLists.txt"

    pull_request:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "cmake/**"
            - "*.h"
            - "*.hpp"
            - "*.cpp"
            - "*.cmake"
            - "CMakeLists.txt"

defaults:
    run:
        shell: sh

jobs:
    build-project:
        name: "Build project"

        strategy:
            matrix:
                system:
                    - windows-2022
                    - ubuntu-24.04
                config:
                    - Debug
                    - Release
                compiler:
                    - clang
                    - gcc
                    - msvc
                exclude:
                    - system: ubuntu-24.04
                      compiler: msvc
                    - system: windows-2022
                      compiler: clang
                include:
                    # Windows Server 2022, Visual C++
                    - {
                          system: windows-2022,
                          compiler: msvc,
                          compiler-c: cl,
                          compiler-cxx: cl
                      }

                    # Windows Server 2022, MinGW
                    - {
                          system: windows-2022,
                          compiler: gcc,
                          compiler-c: gcc,
                          compiler-cxx: g++
                      }

                    # Ubuntu Linux 24.04, Clang-19
                    - {
                          system: ubuntu-24.04,
                          compiler: clang,
                          compiler-c: clang-19,
                          compiler-cxx: clang++-19
                      }

                    # Ubuntu Linux 24.04, GCC 14
                    - {
                          system: ubuntu-24.04,
                          compiler: gcc,
                          compiler-c: gcc-14,
                          compiler-cxx: g++-14
                      }

            fail-fast: false

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup GCC and Clang
              if: ${{ runner.os == 'Linux' }}
              run: |
                  sudo apt update && \
                  sudo apt install -y \
                      g++-14 \
                      clang-19

            - name: Setup Ninja
              uses: imesense/gha-setup-ninja@v0.2

            - name: Setup Conan
              uses: imesense/gha-setup-conan@v0.1

            - name: Enable Visual Studio Command Prompt (Visual C++)
              if: ${{ matrix.compiler-c == 'cl' && matrix.compiler-cxx == 'cl' }}
              uses: ilammy/msvc-dev-cmd@v1


            - name: Set path (Windows)
              if: ${{ runner.os == 'Windows' }}
              shell: pwsh
              run: |
                  $github_workspace = "${{ github.workspace }}"
                  $workspace = ($github_workspace -replace '\\','/')
                  Add-Content `
                      -Path $env:GITHUB_ENV `
                      -Value "workspace=$workspace"

            - name: Set path (Linux)
              if: ${{ runner.os != 'Windows' }}
              shell: sh
              run: |
                  export workspace=${{ github.workspace }}
                  echo "workspace=$workspace" >> $GITHUB_ENV

            - name: Detect build profile
              env:
                CC: ${{ matrix.compiler-c }}
                CXX: ${{ matrix.compiler-cxx }}

              run: |
                  conan \
                      profile detect

            - name: Install dependencies
              run: |
                  conan \
                      install . \
                      --build=missing \
                      -of conan-deps \
                      -s build_type=${{ matrix.config }}
              env:
                CC: ${{ matrix.compiler-c }}
                CXX: ${{ matrix.compiler-cxx }}


            - name: Configure project (Windows)
              if: ${{ runner.os == 'Windows' }}
              shell: pwsh
              run: |
                  cmake `
                      -S ${{ env.workspace }} `
                      -B ${{ env.workspace }}/build `
                      -G "Ninja Multi-Config" `
                      -D CMAKE_PREFIX_PATH="${{ env.workspace }}/conan-deps" `
                      -D CMAKE_MODULE_PATH="${{ env.workspace }}/conan-deps"

            - name: Configure project (Linux)
              if: ${{ runner.os == 'Linux' }}
              run: |
                  cmake \
                      -S ${{ env.workspace }} \
                      -B ${{ env.workspace }}/build \
                      -G "Ninja Multi-Config" \
                      -D CMAKE_C_COMPILER=${{ matrix.compiler-c }} \
                      -D CMAKE_CXX_COMPILER=${{ matrix.compiler-cxx }} \
                      -D CMAKE_PREFIX_PATH="${{ env.workspace }}/conan-deps" \
                      -D CMAKE_MODULE_PATH="${{ env.workspace }}/conan-deps"

            - name: Build project
              run: |
                  cmake \
                      --build ${{ env.workspace }}/build \
                      --config ${{ matrix.config }}

            - name: Install project
              run: |
                  cmake \
                      --install ${{ env.workspace }}/build \
                      --config ${{ matrix.config }} \
                      --prefix ${{ env.workspace }}/build/install

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-${{ matrix.system }}-${{ matrix.compiler-cxx }}-${{ matrix.config }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/build/install/
