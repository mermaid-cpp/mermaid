# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Build project"

on:
    push:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "cmake/**"
            - "*.h"
            - "*.hpp"
            - "*.cpp"
            - "*.cmake"
            - "CMakeLists.txt"

    pull_request:
        branches:
            - "**"
        paths:
            - ".github/workflows/**"
            - "cmake/**"
            - "*.h"
            - "*.hpp"
            - "*.cpp"
            - "*.cmake"
            - "CMakeLists.txt"

defaults:
    run:
        shell: sh

jobs:
    build-project:
        name: "Build project"

        strategy:
            matrix:
                system:
                    - ubuntu-24.04
                config:
                    - Debug
                    - Release
                include:
                    # Ubuntu Linux 24.04, GCC 14, Debug
                    - {
                          system: ubuntu-24.04,
                          config: Debug,
                          compiler-c: gcc-14,
                          compiler-cxx: g++-14
                      }
                    # Ubuntu Linux 24.04, GCC 14, Release
                    - {
                          system: ubuntu-24.04,
                          config: Release,
                          compiler-c: gcc-14,
                          compiler-cxx: g++-14
                      }
                    # Ubuntu Linux 24.04, Clang 18, Debug
                    - {
                          system: ubuntu-24.04,
                          config: Debug,
                          compiler-c: clang-20,
                          compiler-cxx: clang++-20
                      }
                    # Ubuntu Linux 24.04, Clang 20, Release
                    - {
                          system: ubuntu-24.04,
                          config: Release,
                          compiler-c: clang-20,
                          compiler-cxx: clang++-20
                      }
            fail-fast: false

        runs-on: ${{ matrix.system }}

        env:
            CC: ${{ matrix.compiler-c }}
            CXX: ${{ matrix.compiler-cxx }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup GCC and Clang
              if: ${{ runner.os == 'Linux' }}
              run: |
                  sudo apt update && \
                  sudo apt install -y \
                      clang-20 \
                      libc++-20-dev \
                      libc++abi-20-dev

            - name: Setup Ninja
              uses: imesense/gha-setup-ninja@v0.2

            - name: Setup Conan
              uses: imesense/gha-setup-conan@v0.1

            - name: Set path (Windows)
              if: ${{ runner.os == 'Windows' }}
              shell: pwsh
              run: |
                  $github_workspace = "${{ github.workspace }}"
                  $workspace = ($github_workspace -replace '\\','/')
                  Add-Content -Path $env:GITHUB_ENV -Value "workspace=$workspace"

            - name: Set path (Linux)
              if: ${{ runner.os != 'Windows' }}
              shell: sh
              run: |
                  export workspace=${{ github.workspace }}
                  echo "workspace=$workspace" >> $GITHUB_ENV

            - name: Detect build profile
              run: |
                  conan \
                      profile detect

            - name: Install dependencies
              run: |
                  conan \
                      install ${{ env.workspace }} \
                      -of conan-deps \
                      -s build_type=${{ matrix.config }} \
                      -s compiler=clang \
                      -s compiler.version=20 \
                      -s compiler.libcxx=libc++ \
                      --build=missing

            - name: Configure project (Windows)
              if: ${{ runner.os == 'Windows' }}
              run: |
                  cmake \
                      -S ${{ env.workspace }} \
                      -B ${{ env.workspace }}/build \
                      -G "Ninja Multi-Config" \
                      -DCMAKE_PREFIX_PATH="${{ env.workspace }}/conan-deps" \
                      -DCMAKE_MODULE_PATH="${{ env.workspace }}/conan-deps"

            - name: Configure project (Linux)
              if: ${{ runner.os == 'Linux' }}
              run: |
                  cmake \
                      -S ${{ env.workspace }} \
                      -B ${{ env.workspace }}/build \
                      -G "Ninja Multi-Config" \
                      -D CMAKE_PREFIX_PATH="${{ env.workspace }}/conan-deps" \
                      -D CMAKE_MODULE_PATH="${{ env.workspace }}/conan-deps" \
                      -D CMAKE_C_COMPILER=${{ matrix.compiler-c }} \
                      -D CMAKE_CXX_COMPILER=${{ matrix.compiler-cxx }} \
                      -D CMAKE_CXX_FLAGS="-stdlib=libc++" \
                      -D CMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
                      -D CMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++"

            - name: Build project
              run: |
                  cmake \
                      --build ${{ env.workspace }}/build \
                      --config ${{ matrix.config }}

            - name: Install project
              run: |
                  cmake \
                      --install ${{ env.workspace }}/build \
                      --config ${{ matrix.config }} \
                      --prefix ${{ env.workspace }}/build/install

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-${{ matrix.system }}-${{ matrix.compiler-cxx }}-${{ matrix.config }}-${{ github.sha }}
                  path: |
                      ${{ github.workspace }}/build/install/
